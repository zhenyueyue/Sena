[package]
name = "sena"
version = "0.1.0"
edition = "2024"
description = "Sena (星奈) — a lightweight, context-aware Windows desktop companion."
license = "Apache-2.0"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
bytemuck = { version = "1.23", features = ["derive"] }
glam = "0.27"
gltf = "1.4"
pollster = "0.3"
wgpu = "0.19.4"
slint = { version = "1.18.1", default-features = false, features = [
    "backend-winit",
    "compat-1-18",
    "renderer-femtovg",
    "raw-window-handle-06",
    "std",
] }

[build-dependencies]
cc = "1.2"
slint-build = { version = "1.18.1", default-features = false, features = ["compat-1-18"] }
winresource = "0.1.31"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[target."cfg(windows)".dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security", "Foundation", "Media_Control", "Win32_System_WinRT", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_DirectComposition", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_RemoteDesktop", "Win32_System_LibraryLoader", "Win32_Graphics_Dwm", "Win32_UI_Controls"] }
